<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Lumela app icon. Buzzspire family style: glossy tile in the product hue (rose),
       simple round-capped line glyph in a deep tint of the same hue. -->
  <defs>
    <radialGradient id="body" cx="34%" cy="26%" r="88%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.05" stop-color="#ffe6f2"/>
      <stop offset="0.18" stop-color="#ffb3d9"/>
      <stop offset="0.46" stop-color="#f472b6"/>
      <stop offset="0.74" stop-color="#d63d8c"/>
      <stop offset="1" stop-color="#8f1d57"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="inner" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dx="-14" dy="-18"/>
      <feGaussianBlur stdDeviation="22" result="o"/>
      <feComposite in="SourceAlpha" in2="o" operator="out" result="edge"/>
      <feFlood flood-color="#2a0717" flood-opacity="0.45"/>
      <feComposite in2="edge" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- tile (macOS-style margin so the icon sits right in docks/taskbars) -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#body)" filter="url(#inner)"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="188.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>

  <!-- glyph: viewfinder corners + a sparkle ("capture, then make it shine") -->
  <g fill="none" stroke="#2a0717" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M292 404V340q0-48 48-48h64"/>
    <path d="M620 292h64q48 0 48 48v64"/>
    <path d="M732 620v64q0 48-48 48h-64"/>
    <path d="M404 732h-64q-48 0-48-48v-64"/>
  </g>
  <path fill="#2a0717" opacity="0.9"
        d="M512 392c10 62 34 86 96 96c-62 10-86 34-96 96c-10-62-34-86-96-96c62-10 86-34 96-96z"/>
  <circle cx="626" cy="398" r="20" fill="#2a0717" opacity="0.9"/>
</svg>
