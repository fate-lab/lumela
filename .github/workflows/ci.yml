name: CI

# Only code changes run CI. Docs, screenshots and package manifests don't.
# The three-OS Rust job runs only when the Rust side (or what it embeds) changes.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "branding/**"
      - "packaging/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/release-notes/**"
      - ".github/workflows/packages.yml"
      - ".github/workflows/release.yml"
      - "scripts/docs-*.mjs"
      - "scripts/update-packages.mjs"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "branding/**"
      - "packaging/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/release-notes/**"
      - ".github/workflows/packages.yml"
      - ".github/workflows/release.yml"
      - "scripts/docs-*.mjs"
      - "scripts/update-packages.mjs"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - "src-tauri/**"
              - "package.json"
              - "package-lock.json"
              - ".github/workflows/ci.yml"

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Browser smoke test (Vite dev server + Tauri mock)
        run: |
          npm run dev -- --port 1420 --strictPort &
          for i in $(seq 1 60); do curl -sf http://localhost:1420/ >/dev/null && break; sleep 1; done
          npm run e2e -- e2e-out
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-out
          if-no-files-found: ignore

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies (Tauri, xcap, tesseract)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev patchelf libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev \
            libegl-dev libgbm-dev tesseract-ocr tesseract-ocr-eng
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # tauri::generate_context! embeds the built frontend.
      - run: npm ci && npm run build
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
